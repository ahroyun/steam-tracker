name: Steam 차트 추적기

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-steam-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt --quiet
      - run: python steam_chart_tracker.py
      - run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add steam_chart_tracker.xlsx
          git diff --staged --quiet || git commit -m "📊 Steam 차트 업데이트: $(date +'%Y-%m-%d')"
          git push
